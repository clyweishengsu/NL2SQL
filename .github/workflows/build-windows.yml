name: Build Windows portable package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build portable application
        run: python -m PyInstaller --noconfirm --clean windows-portable.spec

      - name: Add usage guide and create ZIP
        shell: pwsh
        run: |
          Copy-Item portable-readme.txt dist/NL2SQL-Workbench-Windows-x64/
          Compress-Archive -Path dist/NL2SQL-Workbench-Windows-x64 -DestinationPath dist/NL2SQL-Workbench-Windows-x64.zip -CompressionLevel Optimal

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NL2SQL-Workbench-Windows-x64
          path: dist/NL2SQL-Workbench-Windows-x64.zip
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist/NL2SQL-Workbench-Windows-x64.zip" --generate-notes
